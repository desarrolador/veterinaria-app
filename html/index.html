<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles.css">
    <title>veterinaria app</title>
</head>
<body>
    <!-- Este proyecto es sobre una app para veterinaria -->
    <!-- iniciamos con un header, su logo -->
    <header class="header">
        <img src="../imagenes/imagenlogo.jpg" alt="logo" width="150px">

        <!-- luego continuamos con un navbar, su img principal de la app, h1, p -->
        <div class="navbar">
            <img src="../imagenes/imagenprincipa.jpg" alt="imagen principal de veterinaria app" width="250px" height="250px">
            <h1>Tu veterinaria</h1>
            <p>Aqui podras encontrar todas tus soluciones con tus pacientes</p>
        </div>
    </header>

    <!-- luego continuamos con la seccion de reservar turnos -->
    <section class="servicios">
        <div class="turnos">
            <h2>Turnos</h2>
            <a href="turnos.html" class="btn-1">Reservar Turno</a>
        </div>

        <div class="turnos">
            <h2>Turnos</h2>
            <a href="consulta-telefonica.html" class="btn-1">Solicitar consulta telefónica</a>
        </div>

        <div class="turnos">
            <h2>Turnos</h2>
            <a href="transporte-mascotas.html" class="btn-1">Transporte de mascotas</a>
        </div>

        <div class="turnos">
            <h2>Turnos</h2>
            <a href="fechas-cirugias.html" class="btn-1">Reservar fechas de cirugías</a>
        </div>

        <div class="turnos">
            <h2>Turnos</h2>
            <a href="mas-servicios.html" class="btn-1">Más servicios</a>
        </div>
    </section>

    <div class="registro">
        <h2>Registro de Usuario</h2>
        <form id="registro-form">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>

            <label for="confirm-password">Confirmar Contraseña:</label>
            <input type="password" id="confirm-password" name="confirm-password" required>

            <label>
                <input type="checkbox" id="aceptar-email" name="aceptar-email" required> Acepto recibir información a través de email
            </label>

            <button type="submit">Registrar</button>
        </form>
    </div>

    <script src="../js/index.js"></script>
</body>
</html>
