<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta por email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .h1 {
            text-align: center;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-bottom: 30px;
        }
        .link-email {
            display: flex;
            flex-direction: column;
            max-width: 420px;
            margin: 0 auto;
            padding: 24px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background-color: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .link-email p {
            margin: 0 0 12px;
            color: #555;
            font-size: 16px;
        }
        .link-email a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
            word-break: break-all;
        }
        .link-email a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div>
        <h1 class="h1">Consulta por email</h1>
    </div>
    <div class="link-email">
        <p>Escríbenos a:</p>
        <a href="mailto:desarrollador915@gmail.com">desarrollador915@gmail.com</a>
    </div>
</body>
</html>
